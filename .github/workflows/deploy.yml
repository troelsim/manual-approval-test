name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deploy at a time. In-flight runs are not cancelled so a run that is
# already waiting at the Prod approval gate is never silently dropped.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-deploy-checklist:
    name: Reviewer checklist
    runs-on: ubuntu-latest
    env:
      # Set the STAGING_URL repository variable under Settings -> Secrets and
      # variables -> Actions -> Variables to override the default.
      STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.example.com' }}
      CHECKLIST_FILE: .github/deploy-checklist.md
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write reviewer checklist to job summary
        # The checklist itself lives in $CHECKLIST_FILE so it can be edited
        # without touching this workflow. The reviewer reads it from the run's
        # Summary tab before approving the Prod environment.
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## Production deploy: reviewer checklist"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GIT_SHA}\` |"
            echo "| Ref | \`${GIT_REF}\` |"
            echo "| Triggered by | ${ACTOR} |"
            echo "| Staging | ${STAGING_URL} |"
            echo
            cat "${CHECKLIST_FILE}"
            echo
            echo "When every item is confirmed, click **Review deployments** on this run and approve \`Prod\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-prod:
    name: Deploy to production
    needs: pre-deploy-checklist
    runs-on: ubuntu-latest
    # The `Prod` environment must be configured with required reviewers
    # (Settings -> Environments). This job pauses until a reviewer approves it.
    # See README.md for setup instructions.
    environment:
      name: Prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy
        run: ./scripts/deploy.sh
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref_name }}
